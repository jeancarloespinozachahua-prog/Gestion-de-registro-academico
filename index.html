
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestión Académica</title>
    <link rel="stylesheet" href="stilos.css">
</head>
<body>

    <header>
        <h1 class="titulo">Gestión Académica</h1>
        <p>Registro y listado de estudiantes y cursos</p>
    </header>

    <main>
        <section class="formulario">
            <h2>Registrar estudiante</h2>

            <form id="formularioEstudiante">
                <label for="nombres">Nombres</label>
                <input type="text" id="nombres" required maxlength="60"
                       pattern="[A-Za-zÁÉÍÓÚÜÑáéíóúüñ ]{2,60}"
                       title="Escribe solo letras y espacios (mínimo 2 caracteres).">

                <label for="apellidos">Apellidos</label>
                <input type="text" id="apellidos" required maxlength="60"
                       pattern="[A-Za-zÁÉÍÓÚÜÑáéíóúüñ ]{2,60}"
                       title="Escribe solo letras y espacios (mínimo 2 caracteres).">

                <label for="correo">Correo electrónico</label>
                <input type="email" id="correo" maxlength="120"
                       placeholder="nombre@ejemplo.com" autocomplete="email" required>

                <label for="dni">DNI</label>
                <input type="text" id="dni" maxlength="8"
                       inputmode="numeric" pattern="[0-9]{8}" title="El DNI debe contener exactamente 8 números." required>

                <label for="edad">Edad</label>
                <input type="number" id="edad" min="1" max="120" step="1" inputmode="numeric" required>

                <label for="carrera">Carrera profesional</label>
                <select id="carrera" required>
                    <option value="">Seleccionar carrera</option>
                    <option>Ingeniería de Sistemas</option>
                    <option>Administración</option>
                    <option>Contabilidad</option>
                    <option>Enfermería</option>
                    <option>Educación</option>
                </select>

                <button type="submit">Registrar estudiante</button>
            </form>
            <p id="mensaje" role="status"></p>
        </section>

        <section class="listado">
            <h2>Listado de estudiantes</h2>
            <p>Total registrados: <strong id="total">0</strong></p>

            <div class="tabla">
                <table>
                    <thead>
                        <tr>
                            <th>Nombres</th>
                            <th>Apellidos</th>
                            <th>Correo</th>
                            <th>DNI</th>
                            <th>Edad</th>
                            <th>Carrera</th>
                            <th>Acción</th>
                        </tr>
                    </thead>
                    <tbody id="listaEstudiantes"></tbody>
                </table>
            </div>
        </section>

        <section class="formulario">
            <h2>Registrar curso</h2>

            <form id="formularioCurso">
                <label for="codigoCurso">Código del curso</label>
                <input type="text" id="codigoCurso" maxlength="12"
                       placeholder="Ej. SIS101" pattern="[A-Za-z0-9-]{2,12}"
                       title="Usa de 2 a 12 letras, números o guiones." required>

                <label for="nombreCurso">Nombre del curso</label>
                <input type="text" id="nombreCurso" maxlength="80" required>

                <label for="creditosCurso">Créditos</label>
                <input type="number" id="creditosCurso" min="1" max="20" step="1" inputmode="numeric" required>

                <label for="docenteCurso">Docente</label>
                <input type="text" id="docenteCurso" maxlength="80"
                       pattern="[A-Za-zÁÉÍÓÚÜÑáéíóúüñ ]{2,80}"
                       title="Escribe solo letras y espacios (mínimo 2 caracteres)." required>

                <button type="submit">Registrar curso</button>
            </form>
            <p id="mensajeCurso" role="status"></p>
        </section>

        <section class="listado">
            <h2>Listado de cursos</h2>
            <p>Total registrados: <strong id="totalCursos">0</strong></p>

            <div class="tabla">
                <table>
                    <thead>
                        <tr>
                            <th>Código</th>
                            <th>Curso</th>
                            <th>Créditos</th>
                            <th>Docente</th>
                            <th>Acción</th>
                        </tr>
                    </thead>
                    <tbody id="listaCursos"></tbody>
                </table>
            </div>
        </section>
    </main>

    <script src="validar formulario.js"></script>
    <script src="script.js"></script>
    <script src="cursos.js"></script>
</body>
</html>
